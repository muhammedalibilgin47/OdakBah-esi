name: OdakBahcesi
options:
  bundleIdPrefix: com.tiyzi
  deploymentTarget:
    iOS: "16.2"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  OdakBahcesi:
    type: application
    platform: iOS
    sources:
      - OdakBahcesi
      - Shared
    dependencies:
      - target: OdakWidgets
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: OdakBahcesi/Info.plist
      properties:
        CFBundleDisplayName: "Odak Bahçesi"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        GIDClientID: "227185762488-42esmrp811rhb51ba3l9g8eet9keojjh.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.227185762488-42esmrp811rhb51ba3l9g8eet9keojjh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiyzi.odakbahcesi
        PRODUCT_NAME: OdakBahcesi
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OdakWidgets:
    type: app-extension
    platform: iOS
    sources:
      - OdakWidgets
      - Shared
    info:
      path: OdakWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Odak Bahçesi"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiyzi.odakbahcesi.widgets
        PRODUCT_NAME: OdakWidgets
        SKIP_INSTALL: YES

schemes:
  OdakBahcesi:
    build:
      targets:
        OdakBahcesi: all
