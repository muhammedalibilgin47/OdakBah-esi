name: OdakBahcesi
options:
  bundleIdPrefix: com.tiyzi
  deploymentTarget:
    iOS: "16.2"

settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  OdakBahcesi:
    type: application
    platform: iOS
    sources:
      - OdakBahcesi
      - Shared
    dependencies:
      - target: OdakWidgets
    info:
      path: OdakBahcesi/Info.plist
      properties:
        CFBundleDisplayName: "Odak Bahçesi"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiyzi.odakbahcesi
        PRODUCT_NAME: OdakBahcesi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OdakWidgets:
    type: app-extension
    platform: iOS
    sources:
      - OdakWidgets
      - Shared
    info:
      path: OdakWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Odak Bahçesi"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiyzi.odakbahcesi.widgets
        PRODUCT_NAME: OdakWidgets
        SKIP_INSTALL: YES

schemes:
  OdakBahcesi:
    build:
      targets:
        OdakBahcesi: all
