name: iOS IPA oluştur

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç (Liquid Glass için Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Seçilen: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini oluştur
        run: xcodegen generate

      - name: Uygulamayı derle (imzasız)
        run: |
          xcodebuild \
            -project OdakBahcesi.xcodeproj \
            -scheme OdakBahcesi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OdakBahcesi.app Payload/
          zip -qry OdakBahcesi.ipa Payload

      - name: IPA'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: OdakBahcesi-ipa
          path: OdakBahcesi.ipa

      - name: IPA'yı Release sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OdakBahcesi.ipa \
            --title "Odak Bahçesi (iOS) #${{ github.run_number }}" \
            --notes "OdakBahcesi.ipa dosyasını indirip Sideloadly ile iPhone'a kurun."

      - name: IPA'yı 'ipa' dalına koy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ipa
          git rm -rf --cached . > /dev/null
          git add -f OdakBahcesi.ipa
          git commit -m "IPA #${{ github.run_number }}"
          git push -f origin ipa
