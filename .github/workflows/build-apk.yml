name: Android APK oluştur

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

# Aynı anda iki derleme çalışırsa eskisini iptal et (eski dosya yenisinin üzerine yazılmasın)
concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını çöz
        env:
          ODAK_KEYSTORE_PASSWORD: ${{ secrets.ODAK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ODAK_KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in android/keystore/odak-release.jks.enc \
              -out android/keystore/odak-release.jks \
              -pass env:ODAK_KEYSTORE_PASSWORD
            echo "İmza anahtarı hazır"
          else
            echo "::warning::ODAK_KEYSTORE_PASSWORD gizli ayarı yok; Google girişi çalışmayacak"
          fi

      - name: APK derle
        working-directory: android
        env:
          ODAK_KEYSTORE_PASSWORD: ${{ secrets.ODAK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OdakBahcesi.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: OdakBahcesi-apk
          path: OdakBahcesi.apk

      - name: APK'yı Release sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest OdakBahcesi.apk \
            --title "Odak Bahçesi (Android) #${{ github.run_number }}" \
            --notes "OdakBahcesi.apk dosyasını telefona indirip açın ve Yükle'ye basın."

      - name: APK'yı 'apk' dalına koy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --cached . > /dev/null
          git add -f OdakBahcesi.apk
          git commit -m "APK #${{ github.run_number }}"
          git push -f origin apk
